name: Deploy to GitHub Pages

# Pages cannot serve the repository source: the root index.html is the Vite dev
# shell, which loads /src/main.jsx — unparseable by a browser, so it renders blank.
# This builds the site and publishes dist/ instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves this project site from /<repo>/, so asset URLs
          # must be prefixed or they 404.
          BASE_PATH: /${{ github.event.repository.name }}/

      # /profile/:slug is a client-side route with no file behind it, so a
      # refresh or a shared link would otherwise hit Pages' own 404.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
